<!DOCTYPE html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมยาเภสัช</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap">
<style>
:root{--bg:#f3f0ff;--card:#fff;--ink:#2b2b3a;--mut:#6b6b80;--pri:#7a5ad8;--ok:#1fae93;--okbg:#e3f8f3;--bad:#e5484d;--badbg:#fde8ec;--line:#e1dcf5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--card:#241f40;--ink:#f1eefc;--mut:#aaa3cf;--pri:#a98bff;--ok:#3fd1b6;--okbg:#14352f;--bad:#ff7a80;--badbg:#3d1c26;--line:#3a3363}}
:root[data-theme="dark"]{--bg:#17142a;--card:#241f40;--ink:#f1eefc;--mut:#aaa3cf;--pri:#a98bff;--ok:#3fd1b6;--okbg:#14352f;--bad:#ff7a80;--badbg:#3d1c26;--line:#3a3363}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai","Tahoma",sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{font-size:22px;margin:0}
.coin{background:#ffd23f;color:#5a4300;font-weight:700;border-radius:20px;padding:4px 14px;white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:6px;margin:12px 0 4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.cnt{color:var(--mut);font-size:14px;text-align:right}
.card{background:var(--card);border-radius:22px;padding:16px;margin-top:10px;box-shadow:0 2px 10px rgba(80,60,160,.12)}
.q{display:flex;gap:10px;align-items:center}.mas{width:78px;flex:none}.mas svg{width:78px;height:78px}
.qt{font-weight:700;font-size:19px}.lab{font-size:13px;color:var(--pri);font-weight:700}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{font:inherit;color:inherit;text-align:left;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.fb{margin-top:12px;border-radius:14px;padding:10px 14px;display:none}.fb.ok{display:block;background:var(--okbg)}.fb.bad{display:block;background:var(--badbg)}
.fb small{display:block;color:var(--mut);margin-top:4px}
.next{display:none;width:100%;margin-top:12px;font:inherit;font-weight:700;background:var(--pri);color:#fff;border:0;border-radius:14px;padding:12px;cursor:pointer}
.end{text-align:center;display:none}.big{font-size:44px;font-weight:700}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin-top:16px}
</style></head><body><div class="wrap">
<div class="top"><h1>💊 เกมยาเภสัช</h1><div class="coin">🪙 <span id="c">0</span></div></div>
<div class="bar"><i id="p"></i></div><div class="cnt" id="n"></div>
<div class="card" id="g">
 <div class="q"><div class="mas" id="m"></div><div><div class="lab" id="l"></div><div class="qt" id="t"></div></div></div>
 <div class="opts" id="o"></div><div class="fb" id="f"></div>
 <button class="next" id="x"></button>
</div>
<div class="card end" id="e"><div class="mas" style="margin:0 auto;width:110px" id="em"></div><div class="big" id="s"></div><div id="r"></div>
 <button class="next" style="display:block" id="again">🔄 เล่นอีกครั้ง</button></div>
<div class="note">ตอบถูกได้ 1 เหรียญ ตอบผิดไม่ได้เหรียญ • เพื่อการเรียนรู้เท่านั้น ใช้ยาตามคำแนะนำของแพทย์/เภสัชกร</div>
</div><script>
const D=[{"en": "Aluminium / Magnesium hydroxide", "pr": "แอล-ลู-มิ-เนียม / แมก-นี-เซียม ไฮ-ดรอก-ไซด์", "ef": "ลดกรดในกระเพาะอาหาร แก้แสบร้อนลิ้นปี่ / ช่วยระบาย"}, {"en": "Sucralfate", "pr": "ซู-แครล-เฟต", "ef": "เกาะเคลือบปกป้องแผลในกระเพาะอาหาร"}, {"en": "Omeprazole / Lansoprazole / Famotidine", "pr": "โอ-เม-พรา-โซล / แลน-โซ-พรา-โซล / ฟา-โม-ทิ-ดีน", "ef": "ลดการหลั่งกรด รักษาแผลกระเพาะและกรดไหลย้อน"}, {"en": "Hyoscine butylbromide (Hyosan) / Mebeverine", "pr": "ไฮ-ออส-ซีน บิว-ทิล-โบร-ไมด์ / เม-เบ-เวอ-รีน", "ef": "แก้ปวดเกร็ง คลายกล้ามเนื้อเรียบช่องท้องและลำไส้แปรปรวน"}, {"en": "Simethicone", "pr": "ไซ-เม-ทิ-โคน", "ef": "ขับลม ลดแก๊ส แก้ท้องอืดจุกเสียด"}, {"en": "Domperidone / Metoclopramide", "pr": "ดอม-เพอ-ริ-โดน / เม-โท-โคล-พรา-ไมด์", "ef": "แก้คลื่นไส้ อาเจียน เร่งการเคลื่อนตัวของทางเดินอาหาร"}, {"en": "Activated Charcoal", "pr": "แอก-ทิ-เว-เต็ด ชาร์-โคล", "ef": "ผงถ่านดูดซับสารพิษและเชื้อโรคแก้ท้องเสีย"}, {"en": "Norfloxacin", "pr": "นอร์-ฟล็อก-ซา-ซิน", "ef": "ยาปฏิชีวนะฆ่าเชื้อแบคทีเรียแก้ท้องเสียติดเชื้อ/กระเพาะปัสสาวะอักเสบ"}, {"en": "Senna / Lactulose / Bisacodyl", "pr": "เซน-นา / แลก-ตู-โลส / บิ-ซา-โค-ดิล", "ef": "ยาระบาย กระตุ้นลำไส้บีบตัว หรือทำให้อุจจาระนิ่มเพื่อแก้ท้องผูก"}, {"en": "Paracetamol (Acetaminophen)", "pr": "พา-รา-เซ-ตา-มอล / อะ-เซ-ตา-มิ-โน-เฟน", "ef": "บรรเทาอาการปวดขั้นเบาถึงปานกลาง และลดไข้"}, {"en": "Ibuprofen / Diclofenac / Mefenamic acid / Celecoxib", "pr": "ไอ-บู-โพร-เฟน / ได-โคล-ฟี-แนก / เม-เฟ-นา-มิก แอ-ซิด / เซ-เล-ค็อก-ซิบ", "ef": "ยาแก้อักเสบและแก้ปวดบวมกล้ามเนื้อ ข้อต่อ ฟัน หรือปวดประจำเดือน"}, {"en": "Tramadol / Morphine / Fentanyl", "pr": "ทรา-มา-ดอล / มอร์-ฟีน / เฟน-ทา-นิล", "ef": "ยาแก้ปวดรุนแรงถึงรุนแรงที่สุด ออกฤทธิ์ที่ระบบประสาทส่วนกลาง (กลุ่มโอปิออยด์)"}, {"en": "Tolperisone / Orphenadrine", "pr": "ทอล-เพ-ริ-โซน / ออร์-เฟ-นา-ดรีน", "ef": "ยาคลายกล้ามเนื้อลาย ลดการหดเกร็งตึง ปวดหลัง คอ บ่า ไหล่"}, {"en": "Lorazepam (Travan) / Diazepam / Alprazolam", "pr": "ลอ-รา-ซี-แพม / ได-อา-ซี-แพม / อัล-พรา-โซ-แลม", "ef": "ยาคลายกังวล ช่วยนอนหลับ หรือระงับอาการตื่นตระหนกเฉียบพลัน"}, {"en": "Fluoxetine / Sertraline / Escitalopram", "pr": "ฟลู-ออก-ซิ-ทีน / เซอร์-ทรา-ไลน์ / เอส-สิ-ตา-โล-แพรม", "ef": "ยาต้านเศร้า ปรับสมดุลสารเคมีในสมอง รักษาภาวะซึมเศร้าและวิตกกังวล"}, {"en": "Gabapentin / Pregabalin / Valproate", "pr": "กา-บา-เพน-ติน / พรีกา-บา-ลิน / วาล-โปร-เอท", "ef": "ป้องกันการชัก รักษาอาการปวดแสบร้อนปลายประสาท หรือปรับอารมณ์ไบโพลาร์"}, {"en": "Brimonidine", "pr": "บริ-โม-นิ-ดีน", "ef": "ลดความดันในลูกตา โดยลดการผลิตสารน้ำและเพิ่มการระบายสารน้ำออกจากดวงตา"}, {"en": "Timolol", "pr": "ทิ-โม-ลอล", "ef": "ลดการสร้างสารน้ำในลูกตา ช่วยควบคุมความดันตาในผู้ป่วยต้อหินมุมเปิด"}, {"en": "Latanoprost", "pr": "ลา-ทา-โน-พรอสต์", "ef": "เพิ่มการระบายสารน้ำออกจากดวงตาผ่านช่องทางธรรมชาติเพื่อลดความดันตา"}, {"en": "Chloramphenicol", "pr": "คลอ-แรม-เฟ-นิ-คอล", "ef": "ยับยั้งการเจริญเติบโตของแบคทีเรีย รักษาอาการตาแดงและเยื่อบุตาอักเสบทั่วไป"}, {"en": "Ciprofloxacin", "pr": "ซิ-โปร-ฟลอก-ซา-ซิน", "ef": "ฆ่าเชื้อแบคทีเรียชนิดรุนแรง มักใช้รักษาแผลติดเชื้อที่กระจกตา"}, {"en": "Antazoline / Tetrahydrozoline", "pr": "แอน-ทา-โซ-ลีน / เท-ทรา-ไฮ-โดร-โซ-ลีน", "ef": "ลดอาการคันตาจากภูมิแพ้ และทำให้หลอดเลือดฝอยหดตัวเพื่อลดอาการตาแดง"}, {"en": "Prednisolone", "pr": "เปรด-นิ-โซ-โลน", "ef": "ยาสเตียรอยด์ออกฤทธิ์ต้านการอักเสบอย่างรุนแรง ลดอาการบวม แดง และระคายเคืองในลูกตา"}, {"en": "Carboxymethylcellulose", "pr": "คาร์-บ็อก-ซี-เม-ทิล-เซล-ลู-โลส", "ef": "เพิ่มความชุ่มชื้น บรรเทาอาการตาแห้ง และลดการระคายเคืองตาจากลมหรือแสงแดด"}, {"en": "Enalapril / Losartan / Amlodipine / Atenolol / Carvedilol", "pr": "อี-นา-ลา-พริล / โล-ซาร์-แทน / แอม-โล-ดิ-พีน / อะ-ที-โน-ลอล / คาร์-เว-ดิ-ลอล", "ef": "ยาลดความดันโลหิต ขยายหลอดเลือด หรือลดการทำงานของหัวใจ"}, {"en": "Atorvastatin / Simvastatin / Rosuvastatin", "pr": "อะ-ทอร์-วา-สแตติน / ซิม-วา-สแตติน / โร-ซู-วา-สแตติน", "ef": "ยาลดไขมันคอเลสเตอรอลในเลือด ป้องกันเส้นเลือดตีบ"}, {"en": "Aspirin / Clopidogrel / Warfarin", "pr": "แอส-ไพริน / โคล-พิ-โด-เกรล / วาร์-ฟา-ริน", "ef": "ต้านเกล็ดเลือดหรือต้านการแข็ 87" fill="#fff"/><circle cx="61.475" cy="48.3" r="1.87" fill="#fff"/><ellipse cx="32.150000000000006" cy="56.8" rx="4.25" ry="2.72" fill="#ff9fb2" opacity="0.8"/><ellipse cx="67.85" cy="56.8" rx="4.25" ry="2.72" fill="#ff9fb2" opacity="0.8"/><path d="M46.6 57.65 Q50 60.2 53.4 57.65" stroke="#2b2b3a" stroke-width="1.87" fill="none" stroke-linecap="round"/></svg>`,$=i=>document.getElementById(i);

function pick(b,ok,d){if(done)return;done=true;const key=Q[i].t?"en":"ef";
 [...$("o").children].forEach(k=>{k.disabled=true;if(k.textContent===d[key])k.classList.add("ok")});
